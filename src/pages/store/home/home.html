<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food Store – Catálogo</title>
  <link rel="stylesheet" href="/src/style.css" />
  <link rel="stylesheet" href="./home.css" />
</head>
<body>

  <nav class="navbar">
    <div class="navbar-brand">Food<span>Store</span></div>
    <a href="../cart/cart.html" class="navbar-cart">
      🛒 Carrito
      <span id="cart-count">0</span>
    </a>
  </nav>

  <!-- Overlay del drawer (mobile) -->
  <div id="drawer-overlay" class="drawer-overlay"></div>

  <!-- Drawer lateral (mobile) -->
  <aside id="sidebar-drawer" class="sidebar-drawer" aria-hidden="true">
    <div class="drawer-header">
      <p class="sidebar-title">Categorías</p>
      <button id="btn-cerrar-drawer" class="btn-cerrar-drawer" aria-label="Cerrar filtros">✕</button>
    </div>
    <ul id="categorias-list-drawer"></ul>
  </aside>

  <div class="layout">
    <!-- Sidebar estático (desktop) -->
    <aside class="sidebar">
      <p class="sidebar-title">Categorías</p>
      <ul id="categorias-list"></ul>
    </aside>

    <main class="main">
      <div class="search-bar">
        <input
          type="text"
          id="search-input"
          placeholder="Buscar productos..."
          autocomplete="off"
        />
        <button id="btn-filtrar" class="btn-filtrar" aria-label="Abrir filtro de categorías">
          ☰ Filtrar
        </button>
      </div>
      <div id="productos-container"></div>
    </main>
  </div>

  <script type="module" src="./home.ts"></script>
</body>
</html>
